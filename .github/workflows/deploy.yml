name: Deploy Backend to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'DocuFlow.Api/**'
      - 'DocuFlow.Functions/**'
      - 'DocuFlow.Application/**'
      - 'DocuFlow.Domain/**'
      - 'DocuFlow.Infrastructure/**'
      - 'DocuFlow.slnx'
      - '.github/workflows/deploy.yml'

jobs:
  deploy-api:
    name: Build & Deploy Web API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore DocuFlow.slnx

      - name: Publish API Project
        run: dotnet publish DocuFlow.Api/DocuFlow.Api.csproj --configuration Release --output ./publish-api

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_API_APP_NAME || 'docuflow-api' }}
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: ./publish-api

  deploy-functions:
    name: Build & Deploy Function App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore DocuFlow.slnx

      - name: Publish Functions Project
        run: dotnet publish DocuFlow.Functions/DocuFlow.Functions.csproj --configuration Release --output ./publish-functions

      - name: Deploy to Azure Functions
        uses: azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONS_APP_NAME || 'docuflow-functions' }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONS_PUBLISH_PROFILE }}
          package: ./publish-functions
